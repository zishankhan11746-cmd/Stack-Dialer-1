name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unpack Code and Prepare Workspace
        run: |
          # 1. If user uploaded a ZIP file directly to GitHub, unzip it!
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting all project files..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Locate pubspec.yaml wherever it is
          PUBSPEC_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          if [ -n "$PUBSPEC_DIR" ] && [ "$PUBSPEC_DIR" != "." ]; then
            echo "Found pubspec.yaml in $PUBSPEC_DIR, switching directory..."
            cd "$PUBSPEC_DIR"
          fi

          mkdir -p android android/app

          # 3. Modern declarative Gradle configuration (Required by Flutter 3.47+)
          cat << 'EOF' > android/settings.gradle
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
EOF

          cat << 'EOF' > android/build.gradle
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
EOF

          cat << 'EOF' > android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.stackdialer.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.stackdialer.app"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
EOF

          # 4. Fetch dependencies
          flutter pub get

          # 5. Automatically patch missing namespace or old minSdk in pub cache packages
          find "$HOME/.pub-cache" -name "build.gradle" -exec grep -L "namespace" {} + 2>/dev/null | while read -r f; do
            pname=$(basename $(dirname $(dirname "$f")) | tr -cd "[:alnum:]_")
            sed -i "/android {/a \    namespace \"com.stackdialer.ext.$pname\"" "$f"
          done || true

          find android "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i "s/minSdkVersion = .*/minSdkVersion = 26/g" {} + 2>/dev/null || true
          find android "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i "s/minSdkVersion 1[0-9]/minSdkVersion 26/g" {} + 2>/dev/null || true

          # 6. Build Release APK
          flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p release_out
          APK_FILE=$(find . -name "app-release.apk" -o -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release_out/StackDialer.apk
            echo "APK successfully created:"
            ls -lh release_out/StackDialer.apk
          else
            echo "Error: APK not found!"
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: release_out/StackDialer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}-apk
          name: StackDialer Native Android v1.0.${{ github.run_number }}
          body: "Official StackDialer Native Android Release APK. Download and install directly on your phone!"
          files: release_out/StackDialer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
