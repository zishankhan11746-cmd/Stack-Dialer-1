name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build StackDialer APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          PUBSPEC_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          if [ -n "$PUBSPEC_DIR" ] && [ "$PUBSPEC_DIR" != "." ]; then
            cd "$PUBSPEC_DIR"
          fi

          mkdir -p android/app android/gradle/wrapper

          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXg0MDk2bSAtWFg6K1VzZUcxR0MKb3JnLmdyYWRsZS5kYWVtb249ZmFsc2UKb3JnLmdyYWRsZS5wYXJhbGxlbD1mYWxzZQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUKYW5kcm9pZC5lbmFibGVKZXRpZmllcj10cnVlCg==" | base64 -d > android/gradle.properties

          echo "" | base64 -d > android/settings.gradle

          echo "" | base64 -d > android/build.gradle

          echo "" | base64 -d > android/app/build.gradle

          echo "ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwp6aXBTdG9yZUJhc2U9R1JBRExFX1VTRVJfSE9NRQp6aXBTdG9yZVBhdGg9d3JhcHBlci9kaXN0cwpkaXN0cmlidXRpb25Vcmw9aHR0cHNcOi8vc2VydmljZXMuZ3JhZGxlLm9yZy9kaXN0cmlidXRpb25zL2dyYWRsZS04LjE0LWFsbC56aXAK" | base64 -d > android/gradle/wrapper/gradle-wrapper.properties

          flutter pub get

          find "$HOME/.pub-cache" -name "build.gradle" -exec grep -L "namespace" {} + 2>/dev/null | while read -r f; do
            pname=$(basename $(dirname $(dirname "$f")) | tr -cd "[:alnum:]_")
            sed -i "/android {/a \    namespace \"com.stackdialer.ext.$pname\"" "$f"
          done || true

          find android "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i "s/minSdkVersion = .*/minSdkVersion = 26/g" {} + 2>/dev/null || true
          find android "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i "s/minSdkVersion 1[0-9]/minSdkVersion 26/g" {} + 2>/dev/null || true

          export GRADLE_OPTS="-Xmx4096m -XX:+UseG1GC"
          flutter build apk --release --android-skip-build-dependency-validation

          mkdir -p release_out
          APK_FILE=$(find . -name "app-release.apk" -o -name "*release*.apk" | head -n 1)
          cp "$APK_FILE" release_out/StackDialer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: release_out/StackDialer.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}-apk
          name: StackDialer Native Android v1.0.${{ github.run_number }}
          body: "Official StackDialer Native Android Release APK. Download and install directly on your phone!"
          files: release_out/StackDialer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
