name: Build StackDialer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unpack Code and Prepare Workspace
        run: |
          # 1. If user uploaded a ZIP file directly to GitHub, unzip it!
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting all project files..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Locate pubspec.yaml wherever it is
          PUBSPEC_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          if [ -n "$PUBSPEC_DIR" ] && [ "$PUBSPEC_DIR" != "." ]; then
            echo "Found pubspec.yaml in $PUBSPEC_DIR, switching directory..."
            cd "$PUBSPEC_DIR"
          fi

          # 3. Ensure minSdk is 26
          find android -name "build.gradle*" -exec sed -i "s/minSdkVersion = .*/minSdkVersion = 26/g" {} + 2>/dev/null || true
          find android -name "build.gradle*" -exec sed -i "s/minSdk = .*/minSdk = 26/g" {} + 2>/dev/null || true
          find android -name "build.gradle*" -exec sed -i "s/flutter.minSdkVersion/26/g" {} + 2>/dev/null || true

          # 4. Get dependencies
          flutter pub get

          # 5. Build Release APK
          flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p release_out
          APK_FILE=$(find . -name "app-release.apk" -o -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release_out/StackDialer.apk
            echo "APK successfully created:"
            ls -lh release_out/StackDialer.apk
          else
            echo "Error: APK not found!"
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackDialer-Release-APK
          path: release_out/StackDialer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}-apk
          name: StackDialer Native Android v1.0.${{ github.run_number }}
          body: "Official StackDialer Native Android Release APK. Download and install directly on your phone!"
          files: release_out/StackDialer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
